<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ShahojAI - AI customer support that speaks your customers' language">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f5f5"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ececec" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#e0e0e0"/>

  <!-- Brand lockup -->
  <g transform="translate(90, 96)">
    <path d="M8 4h24a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H16.5L9 36.5a1 1 0 0 1-1.7-.7V30H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4Z" fill="#000000"/>
    <path d="M20 9.5l2.1 5.9a3 3 0 0 0 1.8 1.8l5.9 2.1-5.9 2.1a3 3 0 0 0-1.8 1.8L20 29.1l-2.1-5.9a3 3 0 0 0-1.8-1.8L10.2 19.3l5.9-2.1a3 3 0 0 0 1.8-1.8L20 9.5Z" fill="#ffffff"/>
    <text x="52" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#000000">Shahoj<tspan fill="#1a73e8">AI</tspan></text>
  </g>

  <!-- Eyebrow -->
  <text x="90" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#757575">AI CUSTOMER SUPPORT · BANGLA + ENGLISH</text>

  <!-- Headline -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="-1.5" fill="#000000">
    <tspan x="88" y="330" font-size="62">AI customer support that</tspan>
    <tspan x="88" y="404" font-size="62">speaks your customers'</tspan>
    <tspan x="88" y="478" font-size="62">language.</tspan>
  </text>

  <!-- Sub -->
  <text x="90" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#757575">Answer 90% of repeat questions automatically — in Bangla and English.</text>

  <!-- Decorative chat card -->
  <g transform="translate(836, 196)">
    <rect x="0" y="0" width="280" height="240" rx="20" fill="#ffffff" stroke="#e0e0e0"/>
    <rect x="20" y="28" width="150" height="40" rx="14" fill="#f5f5f5"/>
    <text x="34" y="53" font-family="-apple-system, sans-serif" font-size="15" fill="#1a1a1a">ডেলিভারি কত দিন?</text>
    <rect x="80" y="86" width="180" height="62" rx="14" fill="#000000"/>
    <text x="96" y="110" font-family="-apple-system, sans-serif" font-size="15" fill="#ffffff">ঢাকায় ১–২ দিন,</text>
    <text x="96" y="132" font-family="-apple-system, sans-serif" font-size="15" fill="#ffffff">দেশজুড়ে ৩–৫ দিন।</text>
    <circle cx="34" cy="184" r="4" fill="#34a853"/>
    <text x="48" y="189" font-family="-apple-system, sans-serif" font-size="13" fill="#757575">Answered in 0.8s</text>
  </g>
</svg>
