name: Android APK

on:
  push:
    branches: [production/android-production]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Mapped from secrets so the optional release-signing step can branch on it.
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Decode release keystore (optional — signs release only if secrets are set)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          RELEASE_STORE_FILE=$(pwd)/release.keystore
          RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          EOF

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # Installable preview build (debug-signed → installs on any device).
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Release build kept separate (R8/shrink verification). Its output is NOT
      # used as the installable preview because the CI release APK is unsigned.
      - name: Build release APK (separate; not for install)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage installable artifacts + checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/
          # Include the release APK ONLY if it is actually signed (never the unsigned one).
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/
          fi
          cd dist && sha256sum *.apk | tee SHA256SUMS.txt

      - name: Job summary
        run: |
          {
            echo "### sohojAI APK build"
            echo ""
            echo "**Install \`app-debug.apk\` for testing. Unsigned release APK cannot be installed.**"
            echo ""
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sohojai-debug-apk
          # Paths are repo-root-relative (upload-artifact ignores working-directory).
          path: |
            apps/android/dist/app-debug.apk
            apps/android/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish Beta v0.1 release (on success)
        if: ${{ success() && github.ref == 'refs/heads/production/android-production' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-v0.1
          name: Beta v0.1
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Automated beta build from `production/android-production`.

            **Install `app-debug.apk`** (debug-signed, installable on any device).
            The CI release APK is unsigned and cannot be installed; a signed release
            is produced only when signing secrets are configured.

            Verify: `sha256sum -c SHA256SUMS.txt`
          files: |
            apps/android/dist/app-debug.apk
            apps/android/dist/SHA256SUMS.txt
